# Nightly device runs (tech plan §22.1, §24.1): e2e tests on API 26, 33 and 36, the Baseline Profile and the cold
# start benchmark. All of them run on Gradle Managed Devices (emulators), so the benchmark numbers show trends only;
# the 1.5 s budget is checked on the reference phone.
name: Nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Software rendering: the runners have no GPU.
  GMD_FLAGS: -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --no-parallel

jobs:
  e2e:
    name: E2E on managed devices
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on API 26, 33 and 36
        run: ./gradlew :app:nightlyGroupGithubDebugAndroidTest $GMD_FLAGS

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14

  baseline-profile:
    name: Baseline Profile and startup benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate the Baseline Profile
        run: ./gradlew :app:generateBaselineProfile $GMD_FLAGS

      - name: Cold start benchmark
        run: >-
          ./gradlew :baselineprofile:pixel6Api34GithubBenchmarkReleaseAndroidTest $GMD_FLAGS
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: baselineprofile/build/outputs/
          retention-days: 30

      # A changed profile comes back as a pull request; it is reviewed and merged like any other change.
      - name: Propose the new profile
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/baseline-profile
          title: Update the Baseline Profile
          commit-message: Update the Baseline Profile
          body: Generated by the nightly workflow on a managed Pixel 6 (API 34).
          add-paths: app/src/main/generated/baselineProfiles/**
